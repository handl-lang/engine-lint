[package]
name = "hnl-engine-lint"
version = "0.1.0"
edition = "2024"
description = "The data-driven AST lint engine (ADR-0044 §3). Walks an [`Ast`] using [`handl_language::Language`] data to produce expression-level diagnostics."
license = "MIT"
repository = "https://github.com/handl-lang/engine-lint"
homepage = "https://handl-lang.github.io/docs/engine-lint/"
documentation = "https://handl-lang.github.io/docs/engine-lint/reference/"
readme = "README.md"
keywords = ["handl", "engine", "linter"]
categories = ["development-tools", "compilers"]
# Git-install only: https://github.com/handl-lang/engine-lint (no crates.io).
publish = false

[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-plugin-ext-diag = { git = "https://github.com/handl-lang/host", branch = "main" }
hnl-engine-lex = { git = "https://github.com/handl-lang/engine-lex", branch = "main" }
hnl-engine-parse = { git = "https://github.com/handl-lang/engine-parse", branch = "main" }
hnl-engine-transform = { git = "https://github.com/handl-lang/engine-transform", branch = "main" }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
